# Ruff — standalone config (not in pyproject.toml)

target-version = "py314"
line-length = 88
src = [".", "notebooks"]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
]
ignore = ["E501"]

[lint.isort]
known-first-party = ["stat_for_ds_iscale"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
