[project]
name = "stat-for-ds-iscale"
version = "0.1.0"
description = "Statistics for Data Science course notebooks and exercises (IScale)"
readme = "README.md"
requires-python = ">=3.14.5,<3.15"
dependencies = [
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.62.1",
    "ipykernel>=7.2.0",
    "kiwisolver==1.5.0",
    "matplotlib==3.10.8",
    "numpy==2.4.4",
    "packaging==26.1",
    "pandas==3.0.2",
    "pillow==12.2.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "scipy>=1.17.1",
    "seaborn==0.13.2",
    "six==1.17.0",
    "tzdata==2026.1",
]

[dependency-groups]
dev = [
    "pyrefly>=1.0.0",
    "ruff>=0.15.0",
]

[tool.uv]
managed = true
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["."]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["stat_for_ds_iscale"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
